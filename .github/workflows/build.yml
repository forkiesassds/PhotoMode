name: Build Mod

on:
  push:
    branches: [ "1.20.5", "1.20.2", "1.20", "1.19.4", "1.19.3", "1.19", "1.18" ]
  pull_request:
    branches: [ "1.20.5" ] #pull requests really should only target 1.20.5, anything else is not suitable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Build with Gradle
      run: ./gradlew build
    - name: Get build hash
      id: get-build-hash
      run: |
        id=$(echo ${{github.sha}} | cut -c 1-7)
        echo ${{github.sha}} | cut -c 1-7 >> $GITHUB_OUTPUT
    - name: Get branch name
      id: get-branch
      shell: bash
      run: |
        echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.3.3
      with:
        name: PhotoMode-${{steps.get-branch.outputs.branch}}-${{steps.get-build-hash.outputs.id}}
        path: |
         neoforge/build/libs/* 
         fabric/build/libs/*
